[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rick-and-morty-explorer-api"
version = "1.0.0"
description = "API própria em Django + DRF que consome a API pública de Rick and Morty, gerencia favoritos em SQLite com fallback resiliente, cache configurável e estatísticas analíticas com Pandas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Django>=5.1,<7.0",
    "djangorestframework>=3.15.0,<4.0.0",
    "pandas>=2.2.0,<4.0.0",
    "numpy>=2.0.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "drf-spectacular>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "gunicorn>=22.0.0,<27.0.0",
]

[tool.setuptools.packages.find]
include = ["config*", "explorer*"]
